[project]
name = "bastyn-sdk"
version = "0.1.0"
description = "Bastyn Behavioural Twin SDK — agent telemetry in two lines"
requires-python = ">=3.10"
dependencies = [
    "traceloop-sdk>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bastyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
